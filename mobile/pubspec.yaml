name: nha_water_billing_mobile
description: NHA Camarin Residences — Mobile Meter Reading App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database (offline-first)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2

  # File I/O for sync export/import
  file_picker: ^8.0.6
  share_plus: ^9.0.0

  # Camera for meter photo capture
  image_picker: ^1.1.2

  # JSON / crypto
  crypto: ^3.0.3
  convert: ^3.1.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
